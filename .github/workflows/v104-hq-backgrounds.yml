name: Build v0.10.4 EDSR Backgrounds

on:
  workflow_dispatch:
  push:
    branches: [temp-v104-quality]
    paths:
      - 'tools/build_v104_hq_backgrounds.py'
      - '.github/workflows/v104-hq-backgrounds.yml'

permissions:
  contents: write

jobs:
  build-hq-art:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: temp-v104-quality
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-contrib-python-headless numpy pillow

      - name: Download EDSR x4 model
        run: |
          curl -fL --retry 3 \
            'https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb' \
            -o tools/EDSR_x4.pb
          test -s tools/EDSR_x4.pb

      - name: Generate restored backgrounds
        run: python tools/build_v104_hq_backgrounds.py

      - name: Verify outputs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names = [
              'village_square.jpg', 'market_alley.jpg', 'training_ground.jpg',
              'riverside.jpg', 'shrine_path.jpg', 'aya_house_ext.jpg',
              'aya_house_hallway.jpg'
          ]
          root = Path('game/images/backgrounds/v104')
          for name in names:
              p = root / name
              if not p.exists() or p.stat().st_size < 250_000:
                  raise SystemExit(f'Invalid v0.10.4 output: {p} ({p.stat().st_size if p.exists() else 0} bytes)')
              with Image.open(p) as im:
                  if im.size != (1280, 720):
                      raise SystemExit(f'Wrong size for {p}: {im.size}')
              print(name, p.stat().st_size)
          PY

      - name: Commit restored art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/images/backgrounds/v104/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'art: generate v0.10.4 EDSR scenario backgrounds'
          git push origin HEAD:temp-v104-quality
