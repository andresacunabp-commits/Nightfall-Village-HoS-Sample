name: Portfolio Candidate

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Static candidate audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final assets, runtime files and presentation regressions
        run: python tools/portfolio_audit.py

  build-windows:
    name: Build Windows candidate
    needs: audit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[candidate]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ren'Py Windows distribution
        id: renpy_build
        uses: ProjectAliceDev/renpy-build-action@v1.3.1
        with:
          sdk-version: '8.3.7'
          project-dir: '.'
          package: 'win'
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy

      - name: Upload Windows candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Village-v0.15.0-Windows
          path: ${{ steps.renpy_build.outputs.dir }}
          if-no-files-found: error

      - name: Publish v0.15.0 GitHub Release from candidate commit
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          contains(github.event.head_commit.message, '[candidate]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd "${{ steps.renpy_build.outputs.dir }}"
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build files found for release." >&2
            exit 1
          fi
          if gh release view v0.15.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.15.0 "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.15.0 "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightfall Village v0.15.0 — Portfolio Candidate" \
              --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES_v0.15.0.md"
          fi
